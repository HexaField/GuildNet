apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sitestatuses.guildnet.io
spec:
  group: guildnet.io
  names:
    kind: SiteStatus
    plural: sitestatuses
    singular: sitestatus
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          status:
            type: object
            properties:
              siteID:
                type: string
              updatedAt:
                type: string
    subresources:
      status: {}
