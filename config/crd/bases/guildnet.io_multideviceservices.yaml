apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: federatedservices.guildnet.io
spec:
  group: guildnet.io
  names:
    kind: FederatedService
    plural: federatedservices
    singular: federatedservice
    shortNames:
    - fs
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              selector:
                type: object
                additionalProperties:
                  type: string
              ports:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    port:
                      type: integer
                    targetPort:
                      type: integer
              replicas:
                type: integer
              template:
                type: object
                description: Optional pod template (openAPI not fully specified here; use controller-gen in CI to regenerate)
        required: [spec]
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Replicas
      type: integer
      jsonPath: .spec.replicas
    - name: Sites
      type: string
      jsonPath: .status.perSiteReplicas
