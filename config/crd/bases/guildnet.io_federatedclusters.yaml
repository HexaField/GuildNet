apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: federatedclusters.guildnet.io
spec:
  group: guildnet.io
  names:
    kind: FederatedCluster
    plural: federatedclusters
    singular: federatedcluster
    shortNames:
    - fcluster
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                clusterName:
                  type: string
            status:
              type: object
              properties:
                members:
                  type: array
                  items:
                    type: string
      subresources:
        status: {}
